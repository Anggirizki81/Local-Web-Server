<div class="card mb-3">

    <div class="card-body">


            <input
                type="hidden"
                name="path"
                value="{{ current_path }}">

            <input
                id="fileInput"
                type="file"
                name="file"
                multiple
                hidden>


        <div id="dropZone" class="drop-zone">

            <i class="bi bi-cloud-arrow-up fs-1"></i>

            <h5 class="mt-3">
                Drag & Drop file di sini
            </h5>

            <p class="text-muted mb-0">
                atau klik area ini untuk memilih file
            </p>

        </div>

        <div
            id="uploadProgress"
            class="progress mt-3"
            style="display:none;height:22px;">

            <div
                id="progressBar"
                class="progress-bar progress-bar-striped progress-bar-animated"
                style="width:0%">

                0%

            </div>

        </div>

    </div>

</div>
