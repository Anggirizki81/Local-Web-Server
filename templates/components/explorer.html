<div class="container-fluid">

    <!-- Upload -->
    <form
        id="uploadForm"
        action="/upload"
        method="post"
        enctype="multipart/form-data">

        <input
            type="hidden"
            name="path"
            value="{{ current_path }}">

        <input
            id="fileInput"
            type="file"
            name="file"
            hidden>

    </form>

    <!-- Explorer -->

    {% if items %}

        {% for i in items %}

        <div class="card mb-2 shadow-sm">

            <div class="card-body d-flex justify-content-between align-items-center">

                <div>

                    {% if i.dir %}

                        <a
                            class="text-decoration-none fw-bold"
                            href="/?path={{ i.path }}">

                            📁 {{ i.name }}

                        </a>

                        <div class="text-muted small">

                            Folder

                        </div>

                    {% else %}

                        <div class="fw-semibold">

                            📄 {{ i.name }}

                        </div>

                        <div class="text-muted small">

                            {{ i.size }}

                        </div>

                    {% endif %}

                </div>

                {% if not i.dir %}

                <div class="btn-group">

                    <a
                        class="btn btn-success btn-sm"
                        href="/download/{{ i.path }}">

                        Download

                    </a>

                    <a
                        class="btn btn-danger btn-sm"
                        href="/delete/{{ i.path }}">

                        Delete

                    </a>

                </div>

                {% endif %}

            </div>

        </div>

        {% endfor %}

    {% else %}

    <div class="alert alert-secondary">

        Folder kosong.

    </div>

    {% endif %}

</div>
